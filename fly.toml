app = "billard-score-app"
primary_region = "fra"

[build]
  builder = "paketobuildpacks/builder:base"
  buildpacks = ["paketo-buildpacks/nodejs"]

[build.args]
  NODE_VERSION = "18.18.0"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  NEXT_PUBLIC_WEBSOCKET_URL = "wss://www.5quilles.com/api/ws"
  NEXT_PUBLIC_ORIGIN_URL = "https://www.5quilles.com"
  WEBSOCKET_URL = "wss://www.5quilles.com/api/ws"
  ORIGIN_URL = "https://www.5quilles.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_https = { enabled = true }

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "get"
    path = "/"
    protocol = "http"

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"